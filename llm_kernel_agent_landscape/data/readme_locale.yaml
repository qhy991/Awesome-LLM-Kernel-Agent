  intro_title: "简介"
  intro_lead: >-
    欢迎阅读 **Awesome LLM Kernel Agent** —— 这是一个关于使用大语言模型（LLM）进行 GPU 内核生成与优化的前沿研究精选合集。
    本仓库追踪 AI 与高性能计算交汇的快速发展方向。
  what_is_title: "什么是基于 LLM 的内核生成？"
  what_is_lead: >-
    GPU 内核编程（CUDA、Triton、HIP 等）需要并行计算、内存层次与硬件架构方面的深厚经验。
    近年来 LLM 的发展为**自动化内核开发**带来了新的可能：
  bullets:
