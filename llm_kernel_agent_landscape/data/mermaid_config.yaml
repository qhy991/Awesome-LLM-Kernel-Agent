# Mermaid rendering & README sync configuration

readme_path: ../README.md

markers:
  report_timeline:
    begin: "<!-- LANDSCAPE-TIMELINE-REPORT:BEGIN -->"
    end: "<!-- LANDSCAPE-TIMELINE-REPORT:END -->"
  full_timeline:
    begin: "<!-- LANDSCAPE-TIMELINE-FULL:BEGIN -->"
    end: "<!-- LANDSCAPE-TIMELINE-FULL:END -->"
  category_map:
    begin: "<!-- LANDSCAPE-CATEGORY-MAP:BEGIN -->"
    end: "<!-- LANDSCAPE-CATEGORY-MAP:END -->"

timelines:
